name: CI/CD Pipeline - Build & Auto Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-build:
    name: Build & Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install --prefer-offline --no-audit

      - name: Build Production Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  deploy:
    name: Deploy on Production Server (Self-Hosted Docker)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ci-build
    runs-on: self-hosted
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Pull Latest Code, Rebuild Containers & Migrate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_DIR="/var/www/abt-portal"
          cd "$TARGET_DIR"

          echo "Fetching commit ${GITHUB_SHA::7}..."
          AUTH_B64=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_B64}" fetch "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git reset --hard FETCH_HEAD

          echo "Building & restarting Docker services..."
          docker compose up -d --build app worker
          docker exec abt_portal_app npm run factory:migrate

          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3008/api/health && echo "Deploy OK: $(git rev-parse --short HEAD)" && exit 0
            sleep 2
          done
          echo "Health check failed after 60s"
          exit 1

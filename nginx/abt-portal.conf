# Cấu hình bảo mật Nginx Reverse Proxy cho ABT Portal Enterprise (abt-portal.com)
server {
    listen 80;
    server_name abt-portal.com www.abt-portal.com;
    # Chuyển hướng toàn bộ HTTP sang HTTPS an toàn
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name abt-portal.com www.abt-portal.com;

    # Chứng chỉ SSL/TLS Let's Encrypt hoặc chứng chỉ số doanh nghiệp
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Giao thức bảo mật TLS 1.2 và 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling (cần chuỗi chứng chỉ đầy đủ: fullchain.pem)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Không lộ phiên bản nginx
    server_tokens off;

    # 1. Security headers (HSTS, CSP có nonce, COOP/CORP, Permissions-Policy...) do ứng dụng Next.js (src/proxy.ts) gửi.
    #    KHÔNG add_header lại ở đây: header trùng lặp làm công cụ quét (Observatory, securityheaders.com) báo lỗi.

    # Giới hạn kích thước file upload: 200MB (Phục vụ hồ sơ thầu, video FSE, catalog, CO/CQ)
    client_max_body_size 200M;

    # 2. Gzip nén dữ liệu truyền tải tối ưu tốc độ tải trang
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://app:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header X-Powered-By;
        
        # Timeout cho file dung lượng lớn
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# Cấu hình bảo mật Nginx Reverse Proxy cho TBR Portal Enterprise (tbr-portal.vn)
server {
    listen 80;
    server_name tbr-portal.vn www.tbr-portal.vn;
    # Chuyển hướng toàn bộ HTTP sang HTTPS an toàn
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tbr-portal.vn www.tbr-portal.vn;

    # Chứng chỉ SSL/TLS Let's Encrypt hoặc chứng chỉ số doanh nghiệp
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Giao thức bảo mật TLS 1.2 và 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 1. Bảo mật HTTP Security Headers chuẩn doanh nghiệp
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Giới hạn kích thước file upload: 200MB (Phục vụ hồ sơ thầu, video FSE, catalog, CO/CQ)
    client_max_body_size 200M;

    # 2. Gzip nén dữ liệu truyền tải tối ưu tốc độ tải trang
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://app:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout cho file dung lượng lớn
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

name: abt-portal

services:
  # 1. Cơ sở dữ liệu PostgreSQL 18 (hỗ trợ uuidv7 cho phân hệ Nhà máy)
  db:
    image: postgres:18-alpine
    container_name: abt_postgres_db
    restart: always
    environment:
      POSTGRES_DB: abt_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/abt_schema_init.sql:/docker-entrypoint-initdb.d/01-abt-schema.sql:ro
    networks:
      - abt_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abt_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Next.js ABT Portal (cổng nội bộ 3008, đứng sau Nginx máy chủ + Cloudflare Tunnel)
  app:
    image: abt-portal-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abt_portal_app
    restart: always
    ports:
      - "127.0.0.1:3008:3008"
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      PORT: 3008
      HOSTNAME: 0.0.0.0
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: abt_portal
      FACTORY_PGDATABASE: abt_factory
      FACTORY_FILE_DIR: /app/uploads/factory
      FACTORY_ALLOW_DEMO_SEED: "0"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://abt-portal.com}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      ZALO_OA_SECRET_KEY: ${ZALO_OA_SECRET_KEY:-}
      DOCUMENT_LINK_TTL_DAYS: ${DOCUMENT_LINK_TTL_DAYS:-30}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3008/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - abt_internal_net

  # 3. Worker đồng bộ Outbox Kinh doanh <-> Nhà máy và tác vụ định kỳ
  worker:
    image: abt-portal-app:latest
    container_name: abt_factory_worker
    restart: always
    command: ["npm", "run", "factory:worker"]
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: abt_portal
      FACTORY_PGDATABASE: abt_factory
      FACTORY_FILE_DIR: /app/uploads/factory
      FACTORY_ALLOW_DEMO_SEED: "0"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      app:
        condition: service_healthy
    networks:
      - abt_internal_net

networks:
  abt_internal_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:

version: "3.8"

services:
  # 1. Cơ sở dữ liệu PostgreSQL cách ly hoàn toàn với Internet
  db:
    image: postgres:16-alpine
    container_name: abt_postgres_db
    restart: always
    environment:
      POSTGRES_DB: abt_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - abt_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Next.js ABT Portal (Chạy quyền non-root user)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abt_portal_app
    restart: always
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: abt_portal
      PORT: 3008
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://abt-portal.com}
      # Khóa ký phiên đăng nhập (đặt chuỗi ngẫu nhiên >= 32 ký tự trong file .env của server)
      SESSION_SECRET: ${SESSION_SECRET:-}
      ZALO_OA_SECRET_KEY: ${ZALO_OA_SECRET_KEY:-}
      DOCUMENT_LINK_TTL_DAYS: ${DOCUMENT_LINK_TTL_DAYS:-30}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3008/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - abt_internal_net
    expose:
      - "3008"

  # 3. Nginx Reverse Proxy (Tường lửa cổng trước, SSL HTTPS & Rate Limiting)
  nginx:
    image: nginx:alpine
    container_name: abt_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/abt-portal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - abt_internal_net

networks:
  abt_internal_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
